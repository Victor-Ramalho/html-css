<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML 5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexível">
    </picture>
    <h1>Reproduzindo Áudios</h1>
    <p>Vamos aprender a reproduzir áudios em HTML 5.</p>
    <audio src="midia/powerful-house.mp3" controls autoplay></audio>
    <!--MP3 WAV OGG -->
    <p>Tambem podemos fazer assim:</p>
    <audio preload="metadata" controls loop>
        <source src="midia/powerful-house.mp3" type="audio/mpeg">
        <source src="midia/powerful-house.ogg" type="audio/ogg">
        <source src="midia/powerful-house.wav" type="audio/wav">
        <p>Infelizmente seu navegador não consegue reproduzir áudio. <a href="midia/powerful-house.mp3"> clique aqui</a> para baixar o áudio.</p>
    </audio>
</body>
</html>
